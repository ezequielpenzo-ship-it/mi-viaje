<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Viaje</title>
<meta name="theme-color" content="#1f2a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Viaje">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#f6f1e8; --card:#fffdf8; --ink:#1f2a33; --ink2:#5a646c; --line:#e4dccd;
  --accent:#b5562b; --accent2:#f3dccd; --ok:#3d7a5c; --warn:#b07d12; --bad:#9a3b3b;
  --r:16px; --shadow:0 1px 2px rgba(31,42,51,.06),0 4px 14px rgba(31,42,51,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding:calc(var(--st) + 8px) 16px calc(var(--sb) + 96px)}
header.top{padding:14px 2px 6px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:4px 0 2px;line-height:1.1}
h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:22px 0 10px}
.sub{color:var(--ink2);font-size:14px}
.banner{background:#fff4d6;border:1px solid #ecd590;color:#6b5210;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.banner b{font-weight:700}
.next{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;margin:14px 0 4px;box-shadow:var(--shadow);cursor:pointer}
.next .eyebrow{color:#f0b896}
.next .t{font-family:var(--serif);font-size:20px;margin:6px 0 4px}
.next .m{color:#c9d1d6;font-size:14px}
.day{margin-top:22px}
.dayh{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px;position:sticky;top:0;background:var(--paper);padding:6px 0;z-index:2}
.dayh .n{font-family:var(--serif);font-size:19px;font-weight:600;text-transform:capitalize}
.dayh .d{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.dayh.today .n{color:var(--accent)}
.empty-day{font-size:14px;color:#9aa1a6;padding:4px 2px 0;font-style:italic}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:left}
.card:active{transform:scale(.99)}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
.card .body{flex:1;min-width:0}
.card .row1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.card .title{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.card .time{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .meta{font-size:13.5px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;background:#efe9de;color:var(--ink2)}
.tag.pendiente{background:#fbeccb;color:#7a5608}
.tag.reservado{background:#dcebe2;color:#2b5b43}
.tag.pagado{background:#d9e6f2;color:#284b6e}
.tag.cancelado{background:#f1dcdc;color:#7d2c2c;text-decoration:line-through}
.tag.code{background:var(--ink);color:#fff;font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.cont{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink2);padding:6px 4px 6px 14px;border-left:3px solid var(--line);margin:0 0 8px 18px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;margin:8px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.file{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.file .th{aspect-ratio:1/1;background:#ece5d8;display:grid;place-items:center;font-size:34px;overflow:hidden}
.file .th img{width:100%;height:100%;object-fit:cover}
.file .cap{padding:8px 10px;font-size:12.5px}
.file .cap b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .cap span{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(var(--sb) + 6px);z-index:20}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:6px 0;font-size:11.5px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .e{font-size:20px;filter:grayscale(1);opacity:.65}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on .e{filter:none;opacity:1}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(var(--sb) + 76px);width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(181,86,43,.4);z-index:21;line-height:1}
.sheet-bg{position:fixed;inset:0;background:rgba(20,26,31,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(var(--sb) + 22px);animation:up .2s ease-out}
.grab{width:42px;height:5px;border-radius:9px;background:#d5ccbc;margin:4px auto 10px}
.sheet{transition:transform .18s ease-out}
.sheet-top{position:sticky;top:-8px;z-index:5;background:var(--paper);margin:-8px -18px 0;padding:8px 18px 2px;display:flex;justify-content:center;align-items:flex-start}
.sheet-x{position:absolute;right:12px;top:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px;line-height:1;color:var(--ink);box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h3{font-family:var(--serif);font-size:24px;margin:6px 0 4px;line-height:1.15}
.kv{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.kv .r{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);align-items:flex-start}
.kv .r:first-child{border-top:0}
.kv .k{width:96px;flex:none;font-size:13px;color:var(--ink2);padding-top:1px}
.kv .v{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
.bigcode{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;margin:12px 0}
.bigcode .c{font-family:ui-monospace,Menlo,monospace;font-size:24px;letter-spacing:.08em;word-break:break-all}
.bigcode small{display:block;color:#aeb8bf;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1}
a.lnk{color:var(--accent);font-weight:600}
form .f{margin:12px 0}
form label{display:block;font-size:13px;color:var(--ink2);margin:0 0 5px 2px;font-weight:600}
form input,form select,form textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px}
form textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .f{margin:0}
.typesel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.typesel button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 2px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.typesel button span{font-size:20px}
.typesel button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.atts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.att{position:relative;width:78px;height:78px;border-radius:12px;border:1px solid var(--line);background:#ece5d8;overflow:hidden;display:grid;place-items:center;font-size:12px;text-align:center;padding:0;cursor:pointer}
.att img{width:100%;height:100%;object-fit:cover}
.att .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:13px;line-height:22px;padding:0}
.att .pdf{padding:4px;word-break:break-all;font-size:10.5px}
.att .pdf b{display:block;font-size:22px}
.viewer{position:fixed;inset:0;background:#0d1115;z-index:60;display:flex;flex-direction:column}
.viewer .vt{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 10px) 14px 10px;color:#fff;gap:10px}
.viewer .vt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.viewer .vb{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:10px;touch-action:pinch-zoom}
.viewer img{max-width:100%;max-height:100%;background:#fff}
.viewer.scan{background:#fff}
.viewer.scan .vt{color:var(--ink)}
.viewer.scan .vb{padding:4px}
.viewer.scan img{width:100%;height:auto;max-height:100%;object-fit:contain}
.vtip{text-align:center;font-size:13px;color:#7a5608;background:#fff4d6;padding:8px;margin:0 12px 6px;border-radius:10px}
.viewer:not(.scan) .vtip{display:none}
.vnav{display:flex;justify-content:space-between;padding:8px 14px calc(var(--sb) + 12px)}
.viewer .vt{gap:8px}
.viewer .vt span{flex:1}
.tix{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tixb{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border:0;border-radius:12px;padding:6px 12px 6px 6px;font-size:14px}
.tixb img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.tixb span{width:40px;height:40px;display:grid;place-items:center;font-size:22px;background:#eee;border-radius:8px}
.viewer .pdfbox{color:#fff;text-align:center;padding:20px}
.dlg{background:var(--card);border-radius:18px;padding:20px;max-width:360px;width:calc(100% - 40px);margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg-bg{position:fixed;inset:0;background:rgba(20,26,31,.45);z-index:80;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 150px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:90;box-shadow:var(--shadow);animation:fade .15s;max-width:90vw;text-align:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.panel p{margin:6px 0;font-size:14.5px}
.panel ol{margin:6px 0;padding-left:20px;font-size:14.5px}
.muted{color:var(--ink2);font-size:13.5px}
.docs{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.docb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;box-shadow:var(--shadow)}
.dth{width:48px;height:48px;flex:none;border-radius:10px;overflow:hidden;background:#ece5d8;display:grid;place-items:center;font-size:24px}
.dth img{width:100%;height:100%;object-fit:cover}
.dtx{flex:1;min-width:0}
.dtx b{display:block;font-size:16px}
.dtx small{display:block;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dgo{color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
.askbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:10px 0 4px;padding:12px;border-radius:14px;border:1px solid #e7c9b6;background:linear-gradient(135deg,#fbeee4,#f6e3f0);color:#6b3a1f;font-weight:700;font-size:15px}
.gintro{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:4px 0 6px}
.gintro p{margin:6px 0 10px;font-size:14.5px}
.bar{height:8px;background:#ece5d8;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .2s}
.grow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.gsi{margin:-4px 2px 10px}
.gsh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gsh h2{margin-right:auto}
.impck{display:flex;align-items:center;gap:10px;font-weight:600;margin:14px 2px}
.impck input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.btn:disabled{opacity:.4}
.glist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gi{display:flex;gap:12px;align-items:flex-start;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.gi:first-child{border-top:0}
.gck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #c9bfae;background:#fff;color:#fff;font-weight:800;font-size:15px;line-height:22px;padding:0;margin-top:1px}
.gi.done .gck{background:var(--ok);border-color:var(--ok)}
.gb{flex:1;min-width:0;cursor:pointer}
.gt{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;margin-bottom:1px}
.gtt{font-size:15px;font-weight:600}
.gi.done .gtt{text-decoration:line-through;color:#9aa1a6;font-weight:500}
.gs{font-size:13px;color:var(--ink2);margin-top:2px}
.gn{font-size:13px;color:#7b8389;margin-top:2px;font-style:italic}
.gi.done .gs,.gi.done .gn{opacity:.6}
.imp{font-size:11px;font-weight:800;color:#fff;background:var(--accent);padding:1px 7px;border-radius:999px;vertical-align:2px;white-space:nowrap}
.gmap{flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-size:17px}
.nav{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.navh{font-weight:700;margin-bottom:4px}
.navr{padding:10px 0;border-top:1px solid var(--line)}
.navr:first-of-type{border-top:0}
.navl{font-size:14.5px}
.navl span{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px;word-break:break-word}
.navb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.navb .btn{text-decoration:none;color:inherit}
.navb .btn.dark{color:#fff}
form .hint{font-size:12px;color:var(--ink2);margin:4px 2px 0}
.nothing{text-align:center;color:var(--ink2);padding:40px 10px}
.nothing .e{font-size:40px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<button class="fab" id="fab" aria-label="Agregar">+</button>

<script>
"use strict";
/* ---------- Config ---------- */
const TYPES = {
  vuelo:      {label:'Vuelo',       icon:'✈️', bg:'#dde7f1', transport:true},
  transporte: {label:'Tren/traslado',icon:'🚆', bg:'#dcebe2', transport:true},
  hospedaje:  {label:'Hospedaje',   icon:'🛏️', bg:'#eadff0'},
  entrada:    {label:'Entrada',     icon:'🎟️', bg:'#f6dfd2'},
  actividad:  {label:'Actividad',   icon:'📍', bg:'#f3e8c8'},
  comida:     {label:'Comida',      icon:'🍽️', bg:'#f1dcdc'},
  nota:       {label:'Nota / doc',  icon:'📝', bg:'#e6e4e0'},
};
const STATUS = {pendiente:'Pendiente', reservado:'Reservado', pagado:'Pagado', cancelado:'Cancelado'};
const CURRENCIES = ['EUR','USD','ARS'];

/* ---------- Storage (IndexedDB, con respaldo en memoria) ---------- */
const Mem = (()=>{const m={items:new Map(),files:new Map(),meta:new Map()};const k={items:'id',files:'id',meta:'key'};
  return {open:async()=>{}, all:async s=>[...m[s].values()], get:async(s,x)=>m[s].get(x), put:async(s,v)=>{m[s].set(v[k[s]],v)}, del:async(s,x)=>{m[s].delete(x)}, clear:async s=>{m[s].clear()}};})();
const IDB = (()=>{let db;
  const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('mi-viaje',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('files',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'});};
    r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});
  const tx=(store,mode,fn)=>new Promise((res,rej)=>{const t=db.transaction(store,mode);const req=fn(t.objectStore(store));let out;
    if(req)req.onsuccess=()=>{out=req.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
  return {open, all:s=>tx(s,'readonly',x=>x.getAll()), get:(s,k)=>tx(s,'readonly',x=>x.get(k)), put:(s,v)=>tx(s,'readwrite',x=>x.put(v)), del:(s,k)=>tx(s,'readwrite',x=>x.delete(k)), clear:s=>tx(s,'readwrite',x=>x.clear())};})();
let DB = IDB, storageOK = true;

/* ---------- State ---------- */
const S = {view:'itin', filter:'todos', q:'', trip:null, items:[], files:[], checks:{}, guide:null, gcity:null, hideDone:false};
const urls = new Map(); // fileId -> objectURL
const SW_OK = (()=>{try{return 'serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost') && window.top===window.self}catch(e){return false}})();
const INSTALLED = (()=>{try{return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true}catch(e){return false}})();

/* ---------- Utils ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad = n=>String(n).padStart(2,'0');
const todayStr = ()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowKey = ()=>{const d=new Date();return `${todayStr()}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const toDate = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays = (s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const diffDays = (a,b)=>Math.round((toDate(b)-toDate(a))/86400000);
const fmtDay = s=>toDate(s).toLocaleDateString('es-AR',{weekday:'long'});
const fmtDM = s=>toDate(s).toLocaleDateString('es-AR',{day:'numeric',month:'long'});
const fmtShort = s=>toDate(s).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
const keyOf = it=>it.startDate?`${it.startDate}T${it.startTime||(it.type==='hospedaje'?'23:00':'12:00')}`:'9999';

/* ---------- Migración: suma direcciones de mapa a los datos del viaje ya cargados ---------- */
async function migrate(){
  const done=await DB.get('meta','mig-maps'); if(done) return;
  const OLD_PLACE={'Anglo American Hotel Florence (Curio Collection by Hilton), Florencia':1,'Hilton Turin Centre, Turín':1,'Lyon Gerland (Av. Tony Garnier)':1};
  for(const s of SEED.items){
    const it=S.items.find(i=>i.id===s.id); if(!it) continue; let ch=false;
    if(!it.addr&&s.addr){it.addr=s.addr;ch=true} if(!it.addr2&&s.addr2){it.addr2=s.addr2;ch=true}
    if(OLD_PLACE[it.place]&&s.place){it.place=s.place;ch=true}
    if(OLD_PLACE[it.to]&&s.to){it.to=s.to;ch=true}
    if(ch) await DB.put('items',it);
  }
  await DB.put('meta',{key:'mig-maps',v:1}); S.items=await DB.all('items');
}

const IS_ANDROID=/Android/i.test(UA);
const COORD=/^\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/;
function navLinks(q,label){
  const m=q.match(COORD), dest=m?`${m[1]},${m[2]}`:q, e=encodeURIComponent, L=[];
  L.push(['Google Maps',`https://www.google.com/maps/dir/?api=1&destination=${e(dest)}&travelmode=walking`]);
  return L;
}
function navTargets(it){
  const T=TYPES[it.type]||TYPES.nota, out=[];
  if(T.transport){
    if(it.addr) out.push({lbl:'Salida', name:it.from||'Salida', q:it.addr});
    if(it.addr2) out.push({lbl:'Llegada', name:it.to||'Llegada', q:it.addr2});
  } else {
    const q=it.addr||it.place; if(q) out.push({lbl:it.type==='hospedaje'?'Alojamiento':'Lugar', name:it.title, q});
  }
  return out;
}

/* ---------- Load ---------- */
async function load(){
  try{ if(!('indexedDB' in window)) throw 0; await IDB.open(); DB=IDB; }
  catch(e){ DB=Mem; storageOK=false; }
  let trip = await DB.get('meta','trip');
  if(!trip){ // instalación nueva: arranca vacía
    trip={key:'trip',name:'Mi viaje',start:'',end:''}; await DB.put('meta',trip);
    await DB.put('meta',{key:'guide',v:[]}); await DB.put('meta',{key:'mig-maps',v:1}); }
  S.trip=trip; S.items=await DB.all('items'); S.files=await DB.all('files');
  await migrate();
  const ck=await DB.get('meta','checks'); S.checks=(ck&&ck.v)||{};
  const gd=await DB.get('meta','guide');
  if(gd){S.guide=gd.v}else{S.guide=cloneGuide(); await saveGuide();} // quien ya tenía este viaje conserva su guía
  let pt=false; S.guide.forEach(c=>{const o=GUIDE.find(x=>x.key===c.key); if(o&&c.from===undefined){c.from=o.from;c.to=o.to;pt=true}}); if(pt) await saveGuide();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

  const app=$('#app');
  app.innerHTML = v==='itin'?viewItin(): v==='res'?viewRes(): v==='guia'?viewGuide(): v==='docs'?viewDocs(): viewCfg();
  if(v==='res'){const q=$('#q'); if(q){q.oninput=e=>{S.q=e.target.value;renderList()}; } renderList();}
}

  let h='';
  if(!storageOK) h+=`<div class="banner"><b>Atención:</b> este navegador no permite guardar datos. Lo que cargues se pierde al cerrar.</div>`;
  else if(!SW_OK && !INSTALLED) h+=`<div class="banner"><b>Vista previa.</b> Para usarla sin conexión en el celular, instalala desde tu propio enlace — ver <a class="lnk" href="#" data-tab="cfg">Ajustes</a>.</div>`;

function countdown(){
  const t=todayStr(), s=S.trip.start, e=S.trip.end;
  if(!s) return '';
  if(t<s){const n=diffDays(t,s);return n===1?'Sale mañana':`Faltan ${n} días`}
  if(t<=e) return `Día ${diffDays(s,t)+1} de ${diffDays(s,e)+1}`;
  return 'Viaje terminado';
}

  const T=TYPES[it.type]||TYPES.nota, nf=filesOf(it.id).length;

  const time = opts.showDate && it.startDate ? fmtShort(it.startDate)+(it.startTime?' · '+it.startTime:'') : (it.startTime||'');
  return `<button class="card" data-open="${it.id}"><div class="ic" style="background:${T.bg}">${T.icon}</div><div class="body">

    ${meta?`<div class="meta">${meta}</div>`:''}

  </div></button>`;
}

    h+=`<div class="next" data-open="${nx.id}"><div class="eyebrow">Próximo</div><div class="t">${T.icon} ${esc(nx.title)}</div>

      ${(()=>{const fs=filesOf(nx.id);if(!fs.length)return '';
        return `<div class="tix">${fs.map((f,k)=>`<button class="tixb" data-view="${f.id}" data-scan="1">${isImg(f)?`<img src="${urlOf(f)}" alt="">`:'<span>📄</span>'}<b>🎫 ${fs.length>1?'Boleto '+(k+1):'Ver boleto'}</b></button>`).join('')}</div>`})()}</div>`;}
  // rango de días
  const dated=items.filter(i=>i.startDate);
  let a=tr.start||dated.map(i=>i.startDate).sort()[0], b=tr.end||a;
  dated.forEach(i=>{if(i.startDate<a)a=i.startDate; const e=i.endDate||i.startDate; if(e>b)b=e;});
  if(a){
    const today=todayStr();
    for(let d=a, guard=0; d<=b && guard<120; d=addDays(d,1),guard++){
      const starts=sortItems(items.filter(i=>i.startDate===d));
      const conts=items.filter(i=>i.startDate&&i.endDate&&i.startDate<d&&i.endDate>=d);
      h+=`<section class="day"><div class="dayh ${d===today?'today':''}"><span class="n">${fmtDay(d)}</span><span class="d">${fmtDM(d)}${d===today?' · hoy':''}</span></div>`;
      conts.forEach(i=>{const T=TYPES[i.type]||TYPES.nota;
        const lbl = i.type==='hospedaje' ? (i.endDate===d?`Check-out · ${esc(i.title)}${i.endTime?' · '+i.endTime:''}`:`Noche en ${esc(i.title||i.place)}`)
          : `${esc(i.title)} · día ${diffDays(i.startDate,d)+1} de ${diffDays(i.startDate,i.endDate)+1}`;
        h+=`<div class="cont" data-open="${i.id}">${T.icon} <span>${lbl}</span></div>`;});
      h+=starts.map(i=>cardHTML(i)).join('');
      if(!starts.length&&!conts.length) h+=`<div class="empty-day">Día libre</div>`;
      h+=`</section>`;
    }
  }
  const und=sortItems(items.filter(i=>!i.startDate));
  if(und.length){h+=`<h2>Sin fecha todavía</h2>`+und.map(i=>cardHTML(i)).join('');}
  if(!S.items.length) h+=`<div class="nothing"><div class="e">🧳</div>Todavía no cargaste nada. Tocá <b>+</b> para empezar.</div>`;
  return h;
}

  if(opt.res && S.items.length){
    L.push('','Mis reservas y traslados:');
    sortItems(S.items.filter(i=>i.status!=='cancelado')).forEach(i=>{const T=TYPES[i.type]||TYPES.nota;

      s+=` · ${STATUS[i.status]||''}`; if(i.notes) s+=` · Nota: ${i.notes.replace(/\s+/g,' ').slice(0,140)}`;

// Achica fotos muy grandes (manteniendo legibles los QR)
function maybeShrink(file){return new Promise(res=>{
  if(!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)||file.size<1.2e6) return res(file);
  const img=new Image(), u=URL.createObjectURL(file);
  img.onload=()=>{const M=2200;let {width:w,height:h}=img;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size<file.size?b:file)},'image/jpeg',.88);};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)}; img.src=u;});}

/* ---------- Backup ---------- */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
function dataURLToBlob(d){const [h,b64]=d.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
async function buildBackup(){const files=[];for(const f of S.files){files.push({id:f.id,itemId:f.itemId,name:f.name,type:f.type,data:await blobToDataURL(f.blob)})}
  return JSON.stringify({app:'mi-viaje',version:1,exported:new Date().toISOString(),trip:S.trip,items:S.items,checks:S.checks,guide:S.guide,files});}
async function restore(text){
  let d; try{d=JSON.parse(text)}catch(e){toast('El archivo no es una copia válida');return}
  if(d.app!=='mi-viaje'||!Array.isArray(d.items)){toast('El archivo no es una copia de Mi Viaje');return}
  if(!await confirmDlg(`Restaurar reemplaza todo lo actual por la copia (${d.items.length} ítems, ${(d.files||[]).length} archivos). ¿Seguir?`,'Restaurar',true))return;
  await DB.clear('items');await DB.clear('files');
  await DB.put('meta',Object.assign({key:'trip'},d.trip||{}));
  for(const i of d.items) await DB.put('items',i);
  await DB.del('meta','mig-maps');
  S.checks=d.checks||{}; await DB.put('meta',{key:'checks',v:S.checks});
  S.guide=d.guide||(d.items.some(i=>/^seed/.test(i.id))?cloneGuide():[]); S.gcity=null; await saveGuide();
  for(const f of d.files||[]) await DB.put('files',{id:f.id,itemId:f.itemId,name:f.name,type:f.type,blob:dataURLToBlob(f.data),size:0});
  urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();
  S.trip=await DB.get('meta','trip');S.items=await DB.all('items');S.files=await DB.all('files');await migrate();render();toast('Copia restaurada');
}

  if(t.id==='expc'){copyText(await buildBackup(),'Copia copiada al portapapeles');return}
  if(t.id==='impt'){openSheet(`<h3>Pegar copia</h3><p class="muted">Pegá el texto de una copia de Mi Viaje.</p><form id="pf"><textarea id="pt" style="width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;padding:10px"></textarea><div class="btnrow"><button class="btn" type="button" onclick="closeSheet()">Cancelar</button><button class="btn pri">Restaurar</button></div></form>`);
    $('#pf').onsubmit=async ev=>{ev.preventDefault();const v=$('#pt').value;closeSheet();await restore(v)};return}
  if(t.id==='wipe'){if(!await confirmDlg(`Se borra "${S.trip.name}" de este teléfono: reservas, archivos, guía y tildados. ¿Ya descargaste la copia?`,'Sí, empezar de cero',true))return;
    await DB.clear('items');await DB.clear('files');urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();
    S.items=[];S.files=[];S.checks={};S.guide=[];S.gcity=null;S.trip={key:'trip',name:'Mi viaje',start:'',end:''};
    await DB.put('meta',{key:'checks',v:{}});await saveGuide();await DB.put('meta',S.trip);
    S.view='cfg';render();scrollTo(0,0);toast('Listo: cargá el nombre y las fechas del nuevo viaje');return}
});
document.addEventListener('change',async e=>{if(e.target.id==='impf'&&e.target.files[0]){const txt=await e.target.files[0].text();e.target.value='';await restore(txt)}});
document.addEventListener('submit',async e=>{if(e.target.id!=='tripf')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());
  if(d.start&&d.end&&d.end<d.start){toast('La fecha final es anterior a la inicial');return}
  S.trip=Object.assign({key:'trip'},S.trip,d);await DB.put('meta',S.trip);toast('Guardado')});
$('#fab').addEventListener('click',()=>editItem(null, S.view==='res'&&TYPES[S.filter]?{type:S.filter}:null));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(document.querySelector('.viewer')||$('#sheet')))goBack()});

async function storageInfo(){try{const el=$('#stinfo');if(!el||!navigator.storage||!navigator.storage.estimate)return;const est=await navigator.storage.estimate();
  const p=navigator.storage.persisted?await navigator.storage.persisted():false;el.textContent=`Usando ${(est.usage/1048576).toFixed(1)} MB en el teléfono${p?' · almacenamiento protegido':''}.`}catch(e){}}
const _render=render; render=function(){_render(); if(S.view==='cfg')storageInfo();};

/* ---------- Start ---------- */
(async()=>{
  await load(); render();
  if(SW_OK){try{await navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
</script>
</body>
</html>
